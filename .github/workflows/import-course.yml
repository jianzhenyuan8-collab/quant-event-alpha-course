name: Import learning course
on:
  push:
    paths:
      - '.course-import/course.tar.xz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Expand verified educational sources
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s .course-import/course.tar.xz.b64 ]; then
            echo "Course payload absent; nothing to import"
            exit 0
          fi
          base64 --decode .course-import/course.tar.xz.b64 > /tmp/course.tar.xz
          tar -tJf /tmp/course.tar.xz | grep -q '^chapters/01-foundations/01.md$'
          tar -tJf /tmp/course.tar.xz | grep -q '^chapters/07-system/60.md$'
          tar -xJf /tmp/course.tar.xz
          rm -rf .course-import
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish all 60 chapters and Python practical labs [skip ci]'
            git push origin HEAD:main
          fi
