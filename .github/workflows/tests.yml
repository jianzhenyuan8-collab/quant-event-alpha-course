name: Run educational labs
on:
  push:
  pull_request:
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke run each lab
        run: |
          for f in labs/*.py; do
            echo "===== $f ====="
            python "$f"
          done
